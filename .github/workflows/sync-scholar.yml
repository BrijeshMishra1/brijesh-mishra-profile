# Note: Google Scholar blocks GitHub-hosted runners, so this usually exits quietly with no change.
# The dependable path is scripts/sync_and_publish.py on a normal network (scripts/install_schedule.sh).
name: Sync Google Scholar

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-scholar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Google Scholar for new papers
        id: sync
        # Exit 2 means Scholar blocked the request: skip quietly, try again next week.
        run: python3 scripts/sync_scholar.py || [ $? -eq 2 ]

      - name: Commit data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scholar-sync.json
          git commit -m "Sync Google Scholar: new papers and metrics"
          git push
